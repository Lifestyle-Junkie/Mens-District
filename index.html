<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mens District — Suit Organization</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f4f4f4;
      --muted: rgba(232, 228, 217, 0.72);
      --line: rgba(255,255,255,.08);
      --text: #e8edf5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #000; display: grid; place-items: center;
      font-family: Inter, system-ui, sans-serif; color: var(--gold);
    }
    .phone {
      width: min(430px, 100vw); height: min(932px, 100vh);
      position: relative; overflow: hidden; background: #000;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .screen { position: absolute; inset: 0; display: none; }
    .screen.active { display: block; }

    .home {
      background:
        linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.28) 28%, rgba(0,0,0,.45) 70%, rgba(0,0,0,.72) 100%),
        url("md.png") center 28% / 92% auto no-repeat;
    }
    .top-bar {
      position: absolute; top: 22px; left: 22px; right: 22px;
      display: flex; align-items: flex-start; justify-content: space-between; z-index: 3;
    }
    .hamburger { width: 28px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: none; border: 0; padding: 0; }
    .hamburger span { display: block; height: 2px; background: #fff; border-radius: 2px; width: 100%; }
    .menu-backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 8;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .menu-backdrop.open { opacity: 1; pointer-events: auto; }
    .side-menu {
      position: absolute; top: 0; left: 0; bottom: 0; width: 236px; z-index: 9;
      background: rgba(0,0,0,.96); border-right: 1px solid rgba(255,255,255,.08);
      transform: translateX(-105%); transition: transform .22s ease;
      padding: 72px 18px 24px; display: flex; flex-direction: column; gap: 10px;
    }
    .side-menu.open { transform: translateX(0); }
    .side-menu button {
      width: 100%; text-align: left; border: 0; border-radius: 12px;
      padding: 14px 14px; background: #1a1a1a; color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .side-menu .signout { background: #2a1518; color: #ffd5d8; }
    .date { font-size: 12px; color: rgba(255,255,255,.82); padding-top: 2px; }
    .brand { position: absolute; top: 38px; left: 0; right: 0; text-align: center; z-index: 2; }
    .crown { width: 54px; height: 40px; margin: 0 auto 6px; }
    .brand h1 {
      font-family: "Cormorant Garamond", serif; font-weight: 500;
      font-size: 28px; letter-spacing: .28em; color: #f3efe6;
    }
    .tagline {
      margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 10px; letter-spacing: .32em; color: var(--muted); text-transform: uppercase;
    }
    .tagline::before, .tagline::after { content: ""; width: 42px; height: 1px; background: rgba(232,228,217,.35); }
    .cta-wrap { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; }
    .suit-btn {
      width: 188px; height: 188px; border-radius: 28px; border: 1.5px solid rgba(255,255,255,.85);
      background: radial-gradient(120% 120% at 50% 20%, rgba(40,40,40,.55), rgba(8,8,8,.82));
      box-shadow: 0 0 24px rgba(255,255,255,.12), inset 0 0 20px rgba(255,255,255,.06);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      color: #fff; cursor: pointer; backdrop-filter: blur(6px);
    }
    .suit-btn svg { width: 72px; height: 72px; }
    .suit-btn span { font-size: 16px; font-weight: 500; text-align: center; padding: 0 10px; }
    .footer {
      position: absolute; left: 28px; right: 28px; bottom: 38px;
      display: flex; align-items: center; justify-content: center; gap: 14px; z-index: 2;
    }
    .footer::before, .footer::after { content: ""; flex: 1; height: 1px; background: rgba(232,228,217,.28); }
    .footer p {
      font-family: "Cormorant Garamond", serif; font-size: 12px; letter-spacing: .22em;
      line-height: 1.55; color: rgba(232,228,217,.82); text-transform: uppercase; white-space: nowrap;
    }

    .list { background: #000; }
    .list-head {
      padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .back { width: 36px; height: 36px; border: 0; background: transparent; color: #fff; font-size: 22px; cursor: pointer; }
    .list-head h2 { font-family: "Cormorant Garamond", serif; font-size: 22px; letter-spacing: .12em; font-weight: 500; }
    .rows {
      overflow-y: auto; height: calc(100% - 64px); padding: 8px 12px 24px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .rows::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .row {
      display: grid; grid-template-columns: 64px 1fr 18px; align-items: center;
      gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .row img { width: 64px; height: 80px; object-fit: cover; border-radius: 8px; background: #111; }
    .row h3 { font-size: 17px; font-weight: 600; color: #f4f6fa; margin-bottom: 4px; }
    .row p { font-size: 13px; color: rgba(210,216,226,.62); }
    .chev { color: rgba(255,255,255,.45); font-size: 18px; }

    .detail { background: #000; color: var(--text); }
    .detail-scroll {
      height: 100%; overflow-y: auto; padding-bottom: 28px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .detail-scroll::-webkit-scrollbar { display: none; }
    .detail-head {
      display: grid; grid-template-columns: 36px 1fr 36px; align-items: center;
      padding: 14px 12px 10px;
    }
    .detail-head h2 { text-align: center; font-size: 17px; font-weight: 600; color: #fff; }
    .heart {
      width: 36px; height: 36px; border: 0; background: transparent; color: #fff;
      font-size: 20px; cursor: pointer;
    }
    .heart.on { color: #ff6b8a; }
    .gallery {
      display: grid; grid-template-columns: 1fr 88px; gap: 8px;
      padding: 0 12px;
    }
    .hero {
      width: 100%; height: 280px; object-fit: cover; border-radius: 14px; background: #111;
    }
    .thumbs { display: flex; flex-direction: column; gap: 8px; }
    .thumbs img {
      width: 88px; height: 88px; object-fit: cover; border-radius: 10px;
      border: 2px solid transparent; cursor: pointer; background: #111;
    }
    .thumbs img.active { border-color: #fff; }

    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding: 14px 12px 8px;
    }
    .tab {
      border: 0; border-radius: 12px; padding: 11px 8px;
      background: #1a1a1a; color: #9aa6b8; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .tab.on { background: #fff; color: #111; }

    .copy { padding: 8px 16px 6px; }
    .copy h1 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .copy .sub { color: #9aa6b8; font-size: 15px; margin-bottom: 12px; }
    .copy .desc { color: #c5cedb; font-size: 15px; line-height: 1.45; }

    .specs {
      margin: 16px 12px 0; border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; overflow: hidden; background: #111;
    }
    .spec {
      display: grid; grid-template-columns: 28px 130px 1fr;
      align-items: center; gap: 10px; padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 14px;
    }
    .spec:last-child { border-bottom: 0; }
    .spec .k { color: #9aa6b8; }
    .spec .v { color: #fff; font-weight: 500; }
    .spec .ico { opacity: .85; font-size: 15px; }

    .to-top {
      position: absolute; right: 16px; bottom: 16px;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12); background: #1a1a1a;
      color: #fff; font-size: 16px; cursor: pointer;
    }

    .fit-block { padding: 8px 16px 0; color: #c5cedb; font-size: 15px; line-height: 1.5; display: none; }
    .fit-block.on { display: block; }
    .overview-block.on { display: block; }
    .overview-block { display: none; }

    .login {
      background:
        linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.45) 50%, rgba(0,0,0,.78) 100%),
        url("md.png") center 22% / 92% auto no-repeat;
      padding: 56px 28px 32px;
      display: none;
      flex-direction: column;
    }
    .login.active { display: flex; }
    .login-brand { text-align: center; margin-bottom: 48px; }
    .login-brand h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500; font-size: 26px; letter-spacing: .24em; color: #f3efe6;
    }
    .login-brand p {
      margin-top: 10px; font-size: 11px; letter-spacing: .28em;
      color: var(--muted); text-transform: uppercase;
    }
    .login form { display: flex; flex-direction: column; gap: 12px; }
    .login label { font-size: 12px; color: #b7c0cc; letter-spacing: .04em; }
    .login input {
      width: 100%; border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.72); color: #fff;
      border-radius: 12px; padding: 14px 14px; font-size: 15px; outline: none;
    }
    .login input:focus { border-color: #fff; }
    .login-btn {
      margin-top: 10px; border: 0; border-radius: 12px; padding: 14px;
      background: #fff; color: #111; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .login-note { margin-top: auto; text-align: center; font-size: 12px; color: rgba(232,228,217,.55); }
    .login-error { color: #ff8b8b; font-size: 13px; min-height: 18px; }

    .admin { background: #0b0b0b; color: #eee; }
    .admin-head {
      padding: 16px 14px 12px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12); background: #111;
    }
    .admin-head h2 { font-size: 15px; letter-spacing: .12em; font-weight: 700; color: #fff; }
    .admin-head .pill, .edit-toggle {
      font-size: 11px; color: #fff; border: 1px solid rgba(255,255,255,.35);
      padding: 5px 10px; border-radius: 999px; background: transparent; cursor: pointer; font-weight: 700;
    }
    .edit-toggle.on { background: #fff; color: #111; border-color: #fff; }
    .admin-actions { display: flex; gap: 8px; padding: 12px; }
    .admin-actions button, .admin-save, .admin-preview {
      border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .admin-save { background: #fff; color: #111; }
    .admin-preview { background: #1a1a1a; color: #fff; }
    .admin-out { background: #2a1518; color: #ffd5d8; }
    .admin-rows { overflow-y: auto; height: calc(100% - 118px); padding: 0 12px 20px; scrollbar-width: none; }
    .admin-rows::-webkit-scrollbar { display: none; }
    .admin-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 8px;
      border: 1px solid rgba(255,255,255,.06); border-radius: 12px;
      margin-bottom: 8px; background: #141414; cursor: pointer;
    }
    .admin-row img { width: 52px; height: 64px; object-fit: cover; border-radius: 8px; flex-shrink: 0; display: block; }
    .thumb-wrap { position: relative; flex-shrink: 0; }
    .pencil, .delx {
      display: none; position: absolute; border: 0; cursor: pointer; z-index: 2;
      width: 20px; height: 20px; border-radius: 50%; font-size: 11px; line-height: 20px; padding: 0;
    }
    .pencil {
      right: -8px; bottom: -6px; background: #fff; color: #111;
    }
    .delx {
      right: -8px; top: -7px; background: #e44545; color: #fff; font-weight: 700;
    }
    .admin-rows.editing .pencil, .admin-rows.editing .delx { display: block; }
    .hidden-file { display: none; }
    .admin-row .meta { flex: 1; min-width: 0; }
    .admin-row h3 { font-size: 15px; color: #fff; }
    .admin-row p { font-size: 12px; color: #9a9a9a; }
    .admin-row .grip { color: #888; font-size: 16px; letter-spacing: -2px; display: none; cursor: grab; padding: 6px; }
    .admin-rows.editing .admin-row .grip { display: block; }
    .admin-rows.editing .admin-row {
      animation: jiggle 0.55s ease-in-out infinite;
      cursor: grab;
    }
    .admin-rows.editing .admin-row:nth-child(2n) { animation-delay: .12s; }
    .admin-rows.editing .admin-row:nth-child(3n) { animation-delay: .2s; }
    .admin-row.dragging { opacity: .9; animation: none !important; transform: scale(1.03); box-shadow: 0 10px 24px rgba(0,0,0,.45); z-index: 5; }
    .screen { touch-action: pan-y; }
    .admin-row input.name {
      width: 100%; border: 0; background: transparent; color: #fff;
      font-size: 15px; font-weight: 600; outline: none; font-family: inherit;
    }
    .admin-row input.sub {
      width: 100%; border: 0; background: transparent; color: #9fb8a6;
      font-size: 12px; outline: none; font-family: inherit;
    }
    @keyframes jiggle {
      0% { transform: rotate(-0.5deg) translateY(0); }
      50% { transform: rotate(0.55deg) translateY(-0.5px); }
      100% { transform: rotate(-0.5deg) translateY(0); }
    }
    .admin-edit { background: #0b0b0b; }
    .admin-form {
      height: calc(100% - 58px); overflow-y: auto; padding: 12px 14px 28px;
      scrollbar-width: none; display: flex; flex-direction: column; gap: 8px;
    }
    .admin-form::-webkit-scrollbar { display: none; }
    .admin-form label { font-size: 11px; color: #9a9a9a; letter-spacing: .04em; }
    .admin-form input, .admin-form textarea {
      width: 100%; border: 1px solid rgba(255,255,255,.18); background: #141414;
      color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit;
    }
    .admin-form textarea { min-height: 72px; resize: vertical; }
    .saved-toast {
      display: none; text-align: center; color: #fff; font-size: 13px; padding-top: 4px;
    }
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 10px; }
    .upload-box {
      position: relative; height: 110px; border-radius: 12px;
      border: 1px dashed rgba(255,255,255,.35); background: #141414;
      overflow: hidden; cursor: pointer;
    }
    .upload-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .upload-box.has img { display: block; }
    .upload-box span {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #9fb8a6; text-align: center; padding: 8px;
    }
    .upload-box.has span { display: none; }
    .upload-box input { display: none; }
  </style>
</head>
<body>
  <div class="phone">
    <section class="screen login active" id="login">
      <div class="login-brand">
        <h1>MENS DISTRICT</h1>
        <p>People | Style | Occasions</p>
      </div>
      <form onsubmit="event.preventDefault(); loginNow();">
        <label>Store name</label>
        <input type="text" id="storeName" placeholder="Miami, Pembroke, Sunrise, Jacksonville" autocomplete="off">
        <p class="login-error" id="loginError"></p>
        <button class="login-btn" type="button" onclick="loginNow()">Sign In</button>
      </form>
      <p class="login-note">Staff access only</p>
    </section>

    <section class="screen home" id="home">
      <div class="top-bar">
        <button class="hamburger" type="button" onclick="toggleMenu(true)" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div></div>
      </div>
      <div class="menu-backdrop" id="menuBackdrop" onclick="toggleMenu(false)"></div>
      <aside class="side-menu" id="sideMenu">
        <button type="button" id="adminPortalBtn" style="display:none" onclick="show('admin')">Admin Portal</button>
        <button class="signout" type="button" onclick="signOut()">Sign Out</button>
      </aside>
      <header class="brand">
        <h1>MENS DISTRICT</h1>
        <div class="tagline">People &nbsp;|&nbsp; Style &nbsp;|&nbsp; Occasions</div>
      </header>
      <div class="cta-wrap">
        <button class="suit-btn" type="button" onclick="show('list')">
          <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 18l6-6h20l6 6"/>
            <path d="M16 18v30h32V18"/>
            <path d="M22 18c1 8 6 12 10 12s9-4 10-12"/>
            <path d="M32 30v18"/>
            <circle cx="32" cy="36" r="1.2" fill="#fff" stroke="none"/>
            <circle cx="32" cy="41" r="1.2" fill="#fff" stroke="none"/>
            <path d="M28 18c.5 3 2 5 4 5s3.5-2 4-5"/>
          </svg>
          <span>Suit Organization</span>
        </button>
      </div>
      <footer class="footer"><p>Dress people for<br>life's best moments</p></footer>
    </section>

    <section class="screen list" id="list">
      <div class="list-head">
        <button class="back" type="button" onclick="show('home')">‹</button>
        <h2>SUIT ORGANIZATION</h2>
      </div>
      <div class="rows" id="rows"></div>
    </section>

    <section class="screen detail" id="detail">
      <div class="detail-scroll" id="detailScroll">
        <div class="detail-head">
          <button class="back" type="button" onclick="show('list')">‹</button>
          <h2 id="detailBrand">Men’s District</h2>
          <button class="heart" id="heart" type="button" onclick="this.classList.toggle('on')">♡</button>
        </div>
        <div class="gallery">
          <img class="hero" id="hero" alt="">
          <div class="thumbs" id="thumbs"></div>
        </div>
        <div class="tabs">
          <button class="tab on" id="tabOverview" type="button" onclick="setTab('overview')">Overview</button>
          <button class="tab" id="tabFit" type="button" onclick="setTab('fit')">Fit & Style</button>
        </div>
        <div class="overview-block on" id="overview">
          <div class="copy">
            <h1 id="detailTitle"></h1>
            <p class="sub" id="detailSub"></p>
            <p class="desc" id="detailDesc"></p>
          </div>
          <div class="specs" id="specs"></div>
        </div>
        <div class="fit-block" id="fit"></div>
      </div>
      <button class="to-top" type="button" onclick="document.getElementById('detailScroll').scrollTo({top:0,behavior:'smooth'})">↑</button>
    </section>

    <section class="screen admin" id="admin">
      <div class="admin-head">
        <h2>ADMIN PORTAL</h2>
        <button class="edit-toggle" id="editToggle" type="button" onclick="toggleListEdit()">Edit</button>
      </div>
      <div class="admin-actions">
        <button class="admin-preview" type="button" onclick="show('home')">Preview user app</button>
        <button class="admin-save" id="addSuitBtn" type="button" onclick="addSuit()" style="display:none">+ Add tab</button>
        <button class="admin-out" type="button" onclick="signOut()">Sign Out</button>
      </div>
      <div class="admin-rows" id="adminRows"></div>
    </section>

    <section class="screen admin-edit" id="adminEdit">
      <div class="admin-head">
        <button class="back" type="button" onclick="show('admin')">‹</button>
        <h2 id="editHeading">Edit collection</h2>
        <span class="pill">Edit</span>
      </div>
      <form class="admin-form" onsubmit="event.preventDefault(); saveEdit();">
        <label>List name</label>
        <input id="f_listName">
        <label>List subtitle</label>
        <input id="f_listSub">
        <label>Page brand header</label>
        <input id="f_brand">
        <label>Product title</label>
        <input id="f_title">
        <label>Subtitle</label>
        <input id="f_sub">
        <label>Overview description</label>
        <textarea id="f_desc"></textarea>
        <label>Fit & Style text</label>
        <textarea id="f_fitCopy"></textarea>
        <label>Brand spec</label>
        <input id="f_brandName">
        <label>Category</label>
        <input id="f_category">
        <label>Fit</label>
        <input id="f_fit">
        <label>Available colors</label>
        <input id="f_colors">
        <label>Lapel options</label>
        <input id="f_lapels">
        <label>Sizes</label>
        <input id="f_sizes">
        <label>Preview images</label>
        <div class="upload-grid">
          <label class="upload-box" id="box0"><img id="prev0" alt=""><span>Main photo<br>tap to upload</span><input type="file" accept="image/*" onchange="uploadPreview(0, this)"></label>
          <label class="upload-box" id="box1"><img id="prev1" alt=""><span>Thumb 2<br>tap to upload</span><input type="file" accept="image/*" onchange="uploadPreview(1, this)"></label>
          <label class="upload-box" id="box2"><img id="prev2" alt=""><span>Thumb 3<br>tap to upload</span><input type="file" accept="image/*" onchange="uploadPreview(2, this)"></label>
          <label class="upload-box" id="box3"><img id="prev3" alt=""><span>Thumb 4<br>tap to upload</span><input type="file" accept="image/*" onchange="uploadPreview(3, this)"></label>
        </div>
        <button class="admin-save" type="submit">Save changes</button>
        <div class="saved-toast" id="savedToast">Saved. Users will see this update.</div>
      </form>
    </section>
  </div>

    function httpImages(arr) {
      return (arr || []).filter(u => typeof u === 'string' && /^https?:\/\//.test(u));
    }
    function cleanItem(item) {
      const out = {};
      Object.keys(item || {}).forEach(k => {
        const v = item[k];
        if (v === undefined || typeof v === 'function') return;
        if (k === 'images') out.images = httpImages(v);
        else out[k] = v;
      });
      if (!out.images) out.images = [];
      return out;
    }
    function persistLocal() {
      try {
        const slim = {};
        Object.keys(CATALOG).forEach(id => {
          slim[id] = Object.assign({}, CATALOG[id], { images: httpImages(CATALOG[id].images) });
        });
        localStorage.setItem('md_catalog', JSON.stringify(slim));
        localStorage.setItem('md_order', JSON.stringify(LIST.map(([id]) => id)));
      } catch (e) {}
    }
    function applyCloud(items, order) {
      if (items && items.length) {
        const seen = [];
        items.forEach(([id, data]) => {
          if (DEFAULT_IDS.indexOf(id) !== -1) return;
          const prev = CATALOG[id] || {};
          const incoming = Object.assign({}, data || {});
          if ((!incoming.images || !incoming.images.length) && prev.images && prev.images.length) {
            incoming.images = prev.images;
          }
          CATALOG[id] = Object.assign({}, prev, incoming);
          seen.push(id);
        });
        const map = {};
        seen.forEach(id => {
          map[id] = [id, CATALOG[id].listName || 'New Suit', CATALOG[id].listSub || ''];
        });
        const next = [];
        (order || []).forEach(id => { if (map[id]) next.push(map[id]); });
        seen.forEach(id => { if (!next.some(x => x[0] === id)) next.push(map[id]); });
        LIST.length = 0;
        next.forEach(item => LIST.push(item));
      }
      persistLocal();
      renderList();
      const admin = document.getElementById('admin');
      if (admin && admin.classList.contains('active')) renderAdmin();
    }
    async function persist() {
      persistLocal();
      if (!cloudOn || !db) {
        cloudStatus('Saved on this device only');
        return false;
      }
      try {
        const ids = LIST.map(x => x[0]).filter(id => CATALOG[id] && DEFAULT_IDS.indexOf(id) === -1);
        await db.collection('md_meta').doc('app').set({ order: ids }, { merge: true });
        for (const id of ids) {
          await db.collection('md_items').doc(id).set(cleanItem(CATALOG[id]));
        }
        cloudStatus(ids.length ? ('Saved ' + ids.length + ' suits to all stores') : 'List empty — saved');
        return true;
      } catch (error) {
        console.error(error);
        cloudStatus('Cloud save failed: ' + (error.code || error.message || 'rules'));
        if (error.code === 'permission-denied') {
          alert('Firestore permission error. Publish rules on Firestore → Rules.');
        } else {
          alert('Save failed: ' + (error.message || error.code || 'unknown'));
        }
        return false;
      }
    }
    let unsubscribeCloud = null;

      if (!cloudOn || !db) {
        cloudStatus('Cloud off — using this device only');
        return;
      }
      if (unsubscribeCloud) unsubscribeCloud();
      unsubscribeCloud = db.collection('md_items').onSnapshot(async snap => {
        const items = [];
        snap.forEach(doc => {
          if (DEFAULT_IDS.indexOf(doc.id) !== -1) {
            doc.ref.delete().catch(() => {});
            return;
          }
          items.push([doc.id, doc.data()]);
        });
        let order = [];
        try {
          const meta = await db.collection('md_meta').doc('app').get();
          order = meta.exists ? (meta.data().order || []) : [];
        } catch (e) {}
        if (!items.length) {
          cloudStatus('Cloud connected — no suits saved yet');
          renderList();
          return;
        }
        applyCloud(items, order);
        cloudStatus('Live — ' + items.length + ' suits in cloud');
      }, error => {
        console.error(error);
        cloudStatus('Cloud blocked: ' + (error.code || 'rules'));
        if (error.code === 'permission-denied') {
          alert('Firestore permission error. Publish rules on Firestore → Rules.');
        }
      });
    }

    function readLocal(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    async function uploadFile(path, file) {
      const localUrl = await readLocal(file);
      if (cloudOn && bucket) {
        try {
          const ref = bucket.child(path);
          await ref.put(file, { contentType: file.type || 'image/jpeg' });
          const url = await ref.getDownloadURL();
          cloudStatus('Photo uploaded');
          return url;
        } catch (e) {
          cloudStatus('Photo upload blocked — enable Storage + publish rules');
          return localUrl;
        }
      }
      return localUrl;
    }
    async function setSuitPhoto(id, input) {
      const file = input.files && input.files[0];
      if (!file || !CATALOG[id]) return;
      cloudStatus('Uploading photo…');
      if (!CATALOG[id].images) CATALOG[id].images = [];
      CATALOG[id].images[0] = URL.createObjectURL(file);
      renderList();
      renderAdmin();
      const url = await uploadFile('suits/' + id + '/list-' + Date.now() + '.jpg', file);
      CATALOG[id].images[0] = url;
      persist();
      renderList();
      renderAdmin();
    }
    function deleteSuit(id) {
      if (!confirm('Remove this suit from the organization list?')) return;
      const i = LIST.findIndex(x => x[0] === id);
      if (i >= 0) LIST.splice(i, 1);
      delete CATALOG[id];
      persistLocal();
      renderList();
      renderAdmin();
      if (cloudOn && db) {
        db.collection('md_items').doc(id).delete().catch(err => console.warn(err));
        db.collection('md_meta').doc('app').set({ order: LIST.map(x => x[0]) }, { merge: true }).catch(() => {});
      }
    }

    let swipeLock = false;
    function bindAdminDrag(wrap) {
      let dragEl = null;
      let startY = 0;
      function yOf(e) {
        return (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY);
      }
      function moveRow(clientY) {
        const rows = [...wrap.querySelectorAll('.admin-row')];
        for (const row of rows) {
          if (row === dragEl) continue;
          const rect = row.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          if (clientY < mid) { wrap.insertBefore(dragEl, row); return; }
        }
        wrap.appendChild(dragEl);
      }
      function endDrag() {
        if (!dragEl) return;
        dragEl.classList.remove('dragging');
        dragEl = null;
        swipeLock = false;
        const ids = [...wrap.querySelectorAll('.admin-row')].map(r => r.dataset.id);
        const map = Object.fromEntries(LIST.map(x => [x[0], x]));
        LIST.length = 0;
        ids.forEach(id => { if (map[id]) LIST.push(map[id]); });
        persist();
        renderList();
      }
      wrap.querySelectorAll('.admin-row').forEach(row => {
        row.addEventListener('dragstart', e => {
          dragEl = row; swipeLock = true;
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        row.addEventListener('dragend', endDrag);
        row.addEventListener('dragover', e => {
          e.preventDefault();
          if (dragEl) moveRow(e.clientY);
        });
        row.addEventListener('touchstart', e => {
          if (!listEditing) return;
          dragEl = row; swipeLock = true; startY = yOf(e);
          row.classList.add('dragging');
        }, {passive:true});
        row.addEventListener('touchmove', e => {
          if (!dragEl) return;
          e.preventDefault();
          moveRow(yOf(e));
        }, {passive:false});
        row.addEventListener('touchend', endDrag);
      });
    }

    function openEdit(id) {
      editingId = id;
      const item = CATALOG[id];
      document.getElementById('editHeading').textContent = item.listName;
      f_listName.value = item.listName;
      f_listSub.value = item.listSub;
      f_brand.value = item.brand;
      f_title.value = item.title;
      f_sub.value = item.sub;
      f_desc.value = item.desc;
      f_fitCopy.value = item.fitCopy;
      f_brandName.value = item.brandName;
      f_category.value = item.category;
      f_fit.value = item.fit;
      f_colors.value = item.colors;
      f_lapels.value = item.lapels;
      f_sizes.value = item.sizes;
      workingImages = [item.images[0] || '', item.images[1] || '', item.images[2] || '', item.images[3] || ''];
      paintPreviews();
      savedToast.style.display = 'none';
      show('adminEdit');
    }

    function paintPreviews() {
      for (let i = 0; i < 4; i++) {
        const box = document.getElementById('box' + i);
        const img = document.getElementById('prev' + i);
        const src = workingImages[i];
        if (src) {
          img.src = src;
          box.classList.add('has');
        } else {
          img.removeAttribute('src');
          box.classList.remove('has');
        }
      }
    }
    async function uploadPreview(i, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      workingImages[i] = URL.createObjectURL(file);
      paintPreviews();
      cloudStatus('Uploading photo…');
      const url = await uploadFile('suits/' + (editingId || 'tmp') + '/img' + i + '-' + Date.now() + '.jpg', file);
      workingImages[i] = url;
      paintPreviews();
      if (editingId && CATALOG[editingId]) {
        if (!CATALOG[editingId].images) CATALOG[editingId].images = ['','','',''];
        CATALOG[editingId].images[i] = url;
        persist();
      }
      if (typeof url === 'string' && url.indexOf('http') === 0) cloudStatus('Photo saved to all stores');
    }

    async function saveEdit() {
      if (!editingId || !CATALOG[editingId]) return;
      const item = CATALOG[editingId];
      item.listName = f_listName.value.trim() || item.listName;
      item.listSub = f_listSub.value.trim();
      item.brand = f_brand.value.trim();
      item.title = f_title.value.trim();
      item.sub = f_sub.value.trim();
      item.desc = f_desc.value.trim();
      item.fitCopy = f_fitCopy.value.trim();
      item.brandName = f_brandName.value.trim();
      item.category = f_category.value.trim();
      item.fit = f_fit.value.trim();
      item.colors = f_colors.value.trim();
      item.lapels = f_lapels.value.trim();
      item.sizes = f_sizes.value.trim();
      const keep = httpImages(item.images);
      item.images = workingImages.map((u, i) => {
        if (typeof u === 'string' && /^https?:\/\//.test(u)) return u;
        return keep[i] || '';
      }).filter(Boolean);
      if (!item.images.length) item.images = keep;
      const row = LIST.find(x => x[0] === editingId);
      if (row) { row[1] = item.listName; row[2] = item.listSub; }
      persistLocal();
      renderList();
      renderAdmin();
      savedToast.style.display = 'block';
      savedToast.textContent = 'Saving Capitano to all stores…'.replace('Capitano', item.listName || 'suit');
      if (!cloudOn || !db) {
        savedToast.textContent = 'Saved on this device only';
        return;
      }
      try {
        await db.collection('md_items').doc(editingId).set(cleanItem(item));
        await db.collection('md_meta').doc('app').set({ order: LIST.map(x => x[0]) }, { merge: true });
        savedToast.textContent = 'Saved. Other stores will see this.';
        cloudStatus('Saved ' + editingId + ' to cloud');
      } catch (error) {
        console.error(error);
        savedToast.textContent = 'Save failed: ' + (error.code || error.message);
        alert('Could not save this suit to the cloud. Publish Firestore rules.');
      }
    }

    function openDetail(id) {
      const item = CATALOG[id];
      document.getElementById('detailBrand').textContent = item.brand;
      document.getElementById('detailTitle').textContent = item.title;
      document.getElementById('detailSub').textContent = item.sub;
      document.getElementById('detailDesc').textContent = item.desc;
      document.getElementById('hero').src = item.images[0];
      document.getElementById('thumbs').innerHTML = item.images.map((src, i) =>
        `<img class="${i===0?'active':''}" src="${src}" alt="" onclick="setHero(this)">`
      ).join('');
      document.getElementById('specs').innerHTML = [
        ["▣", "Brand", item.brandName],
        ["⌂", "Category", item.category],
        ["∥", "Fit", item.fit],
        ["◉", "Available Colors", item.colors],
        ["✓", "Lapel Options", item.lapels],
        ["↕", "Sizes", item.sizes]
      ].map(([ico,k,v]) => `<div class="spec"><span class="ico">${ico}</span><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
      document.getElementById('fit').textContent = item.fitCopy;
      document.getElementById('heart').classList.remove('on');
      setTab('overview');
      document.getElementById('detailScroll').scrollTop = 0;
      show('detail');
    }

    function setHero(el) {
      document.getElementById('hero').src = el.src;
      document.querySelectorAll('#thumbs img').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }

    function setTab(which) {
      document.getElementById('tabOverview').classList.toggle('on', which === 'overview');
      document.getElementById('tabFit').classList.toggle('on', which === 'fit');
      document.getElementById('overview').classList.toggle('on', which === 'overview');
      document.getElementById('fit').classList.toggle('on', which === 'fit');
    }

    function goBack() {
      const active = document.querySelector('.screen.active');
      if (!active) return;
      const id = active.id;
      if (id === 'detail') show('list');
      else if (id === 'list') show('home');
      else if (id === 'adminEdit') show('admin');
      else if (id === 'admin') show('home');
    }
    function bindSwipe(el) {
      let sx=0, sy=0, track=false;
      el.addEventListener('touchstart', e => {
        if (swipeLock) return;
        const t = e.changedTouches[0]; sx=t.clientX; sy=t.clientY; track=true;
      }, {passive:true});
      el.addEventListener('touchend', e => {
        if (!track || swipeLock) { track=false; return; }
        track=false;
        const t = e.changedTouches[0];
        const dx=t.clientX-sx, dy=t.clientY-sy;
        if (dx < -45 && Math.abs(dx) > Math.abs(dy)*1.1) goBack();
      }, {passive:true});
    }

    ['list','detail','admin','adminEdit','home'].forEach(id => bindSwipe(document.getElementById(id)));
    renderList();
    restoreSession();
    loadCloud();
  </script>
</body>
</html>
