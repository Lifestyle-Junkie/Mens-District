<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mens District — Suit Organization</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#f4f4f4; --muted:rgba(232,228,217,.72); --line:rgba(255,255,255,.08); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:#000; display:grid; place-items:center; font-family:Inter,system-ui,sans-serif; color:var(--gold); }
    .phone { width:min(430px,100vw); height:min(932px,100vh); position:relative; overflow:hidden; background:#000; }
    .screen { position:absolute; inset:0; display:none; touch-action:pan-y; }
    .screen.active { display:block; }
    .home { background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.72)), url("md.png") center 28% / 92% auto no-repeat; }
    .top-bar { position:absolute; top:22px; left:22px; right:22px; z-index:3; }
    .hamburger { width:28px; display:flex; flex-direction:column; gap:6px; background:none; border:0; padding:0; }
    .hamburger span { display:block; height:2px; background:#fff; }
    .menu-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:8; opacity:0; pointer-events:none; }
    .menu-backdrop.open { opacity:1; pointer-events:auto; }
    .side-menu { position:absolute; top:0; left:0; bottom:0; width:236px; z-index:9; background:#000; transform:translateX(-105%); transition:transform .22s; padding:72px 18px 24px; display:flex; flex-direction:column; gap:10px; }
    .side-menu.open { transform:translateX(0); }
    .side-menu button { width:100%; text-align:left; border:0; border-radius:12px; padding:14px; background:#1a1a1a; color:#fff; font-weight:600; }
    .side-menu .signout { background:#2a1518; color:#ffd5d8; }
    .brand { position:absolute; top:38px; left:0; right:0; text-align:center; z-index:2; }
    .brand h1 { font-family:"Cormorant Garamond",serif; font-weight:500; font-size:28px; letter-spacing:.28em; }
    .tagline { margin-top:14px; font-size:10px; letter-spacing:.32em; color:var(--muted); text-transform:uppercase; }
    .cta-wrap { position:absolute; inset:0; display:grid; place-items:center; z-index:2; }
    .suit-btn { width:188px; height:188px; border-radius:28px; border:1.5px solid #fff; background:rgba(8,8,8,.82); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
    .suit-btn svg { width:72px; height:72px; }
    .footer { position:absolute; left:28px; right:28px; bottom:38px; text-align:center; font-family:"Cormorant Garamond",serif; font-size:12px; letter-spacing:.22em; text-transform:uppercase; }
    .list,.detail { background:#000; }
    .list-head { padding:14px 12px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
    .detail-head { display:grid; grid-template-columns:36px 1fr 36px; align-items:center; padding:14px 12px; }
    .detail-head h2 { text-align:center; font-size:17px; }
    .back { width:36px; height:36px; border:0; background:transparent; color:#fff; font-size:22px; }
    .list-head h2 { font-family:"Cormorant Garamond",serif; letter-spacing:.12em; }
    .rows { overflow-y:auto; height:calc(100% - 64px); padding:8px 12px 24px; scrollbar-width:none; }
    .row { display:grid; grid-template-columns:64px 1fr 18px; gap:14px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); }
    .row img { width:64px; height:80px; object-fit:cover; border-radius:8px; background:#111; }
    .row h3 { font-size:17px; } .row p { font-size:13px; color:#9aa6b8; }
    .detail-scroll { height:100%; overflow-y:auto; scrollbar-width:none; }
    .heart { border:0; background:transparent; color:#fff; font-size:20px; }
    .gallery { display:grid; grid-template-columns:1fr 88px; gap:8px; padding:0 12px; }
    .hero { width:100%; height:280px; object-fit:cover; border-radius:14px; background:#111; }
    .thumbs img { width:88px; height:88px; object-fit:cover; border-radius:10px; margin-bottom:8px; border:2px solid transparent; }
    .thumbs img.active { border-color:#fff; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 12px; }
    .tab { border:0; border-radius:12px; padding:11px; background:#1a1a1a; color:#9aa6b8; font-weight:600; }
    .tab.on { background:#fff; color:#111; }
    .copy { padding:8px 16px; } .copy h1 { font-size:26px; margin-bottom:6px; } .copy .sub,.copy .desc { color:#c5cedb; }
    .specs { margin:16px 12px; border:1px solid var(--line); border-radius:14px; background:#111; }
    .spec { display:grid; grid-template-columns:28px 130px 1fr; gap:10px; padding:12px 14px; border-bottom:1px solid #222; }
    .to-top { position:absolute; right:16px; bottom:16px; width:40px; height:40px; border-radius:50%; border:0; background:#1a1a1a; color:#fff; }
    .fit-block,.overview-block { display:none; } .fit-block.on,.overview-block.on { display:block; }
    .fit-block { padding:8px 16px; color:#c5cedb; }
    .login { background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.78)), url("md.png") center 22% / 92% auto no-repeat; padding:56px 28px 32px; display:none; flex-direction:column; }
    .login.active { display:flex; }
    .login-brand { text-align:center; margin-bottom:48px; }
    .login-brand h1 { font-family:"Cormorant Garamond",serif; letter-spacing:.24em; }
    .login-brand p { margin-top:10px; font-size:11px; letter-spacing:.28em; color:var(--muted); text-transform:uppercase; }
    .login form { display:flex; flex-direction:column; gap:12px; }
    .login input { border:1px solid #333; background:#000; color:#fff; border-radius:12px; padding:14px; }
    .login-btn { border:0; border-radius:12px; padding:14px; background:#fff; color:#111; font-weight:700; }
    .login-note { margin-top:auto; text-align:center; color:#888; }
    .login-error { color:#ff8b8b; min-height:18px; }
    .admin,.admin-edit { background:#0b0b0b; }
    .admin-head { padding:16px 14px; display:flex; justify-content:space-between; align-items:center; background:#111; }
    .edit-toggle,.pill { border:1px solid #555; background:transparent; color:#fff; border-radius:999px; padding:5px 10px; font-weight:700; font-size:11px; }
    .edit-toggle.on { background:#fff; color:#111; }
    .admin-actions { display:flex; gap:8px; padding:12px; }
    .admin-actions button,.admin-save,.admin-preview { border:0; border-radius:10px; padding:10px 12px; font-weight:600; }
    .admin-save { background:#fff; color:#111; } .admin-preview { background:#1a1a1a; color:#fff; } .admin-out { background:#2a1518; color:#ffd5d8; }
    .admin-rows { overflow-y:auto; height:calc(100% - 118px); padding:0 12px 20px; scrollbar-width:none; }
    .admin-row { display:flex; align-items:center; gap:12px; padding:10px 8px; border-radius:12px; background:#141414; margin-bottom:8px; }
    .admin-row img { width:52px; height:64px; object-fit:cover; border-radius:8px; background:#222; }
    .thumb-wrap { position:relative; }
    .pencil,.delx { display:none; position:absolute; border:0; width:20px; height:20px; border-radius:50%; }
    .pencil { right:-8px; bottom:-6px; background:#fff; } .delx { right:-8px; top:-7px; background:#e44545; color:#fff; }
    .admin-rows.editing .pencil,.admin-rows.editing .delx { display:block; }
    .hidden-file { display:none; }
    .admin-row .meta { flex:1; } .admin-row p { color:#9a9a9a; font-size:12px; }
    .grip { display:none; color:#888; padding:6px; } .admin-rows.editing .grip { display:block; }
    .admin-rows.editing .admin-row { animation:jiggle .55s infinite; }
    .admin-row.dragging { animation:none !important; transform:scale(1.03); }
    @keyframes jiggle { 0%{transform:rotate(-.5deg)} 50%{transform:rotate(.55deg)} 100%{transform:rotate(-.5deg)} }
    .admin-form { height:calc(100% - 58px); overflow-y:auto; padding:12px 14px 28px; display:flex; flex-direction:column; gap:8px; }
    .admin-form label { font-size:11px; color:#9a9a9a; }
    .admin-form input,.admin-form textarea { background:#141414; color:#fff; border:1px solid #333; border-radius:10px; padding:10px 12px; font-family:inherit; }
    .saved-toast { display:none; text-align:center; }
    .upload-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .upload-box { height:110px; border:1px dashed #555; border-radius:12px; background:#141414; position:relative; overflow:hidden; }
    .upload-box img { width:100%; height:100%; object-fit:cover; display:none; }
    .upload-box.has img { display:block; }
    .upload-box span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#9fb8a6; }
    .upload-box.has span { display:none; } .upload-box input { display:none; }
  </style>
</head>
<body>
<div class="phone">
  <section class="screen login active" id="login">
    <div class="login-brand"><h1>MENS DISTRICT</h1><p>People | Style | Occasions</p></div>
    <form onsubmit="event.preventDefault(); loginNow();">
      <label>Store name</label>
      <input id="storeName" placeholder="Miami, Pembroke, Sunrise, Jacksonville" autocomplete="off">
      <p class="login-error" id="loginError"></p>
      <button class="login-btn" type="button" onclick="loginNow()">Sign In</button>
    </form>
    <p class="login-note">Staff access only</p>
  </section>
  <section class="screen home" id="home">
    <div class="top-bar"><button class="hamburger" type="button" onclick="toggleMenu(true)"><span></span><span></span><span></span></button></div>
    <div class="menu-backdrop" id="menuBackdrop" onclick="toggleMenu(false)"></div>
    <aside class="side-menu" id="sideMenu">
      <button type="button" id="adminPortalBtn" style="display:none" onclick="show('admin')">Admin Portal</button>
      <button class="signout" type="button" onclick="signOut()">Sign Out</button>
    </aside>
    <header class="brand"><h1>MENS DISTRICT</h1><div class="tagline">People | Style | Occasions</div></header>
    <div class="cta-wrap">
      <button class="suit-btn" type="button" onclick="show('list')">
        <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="1.8"><path d="M16 18l6-6h20l6 6"/><path d="M16 18v30h32V18"/><path d="M22 18c1 8 6 12 10 12s9-4 10-12"/><path d="M32 30v18"/></svg>
        <span>Suit Organization</span>
      </button>
    </div>
    <footer class="footer">Dress people for<br>life's best moments</footer>
  </section>
  <section class="screen list" id="list">
    <div class="list-head"><button class="back" type="button" onclick="show('home')">‹</button><h2>SUIT ORGANIZATION</h2></div>
    <div class="rows" id="rows"></div>
  </section>
  <section class="screen detail" id="detail">
    <div class="detail-scroll" id="detailScroll">
      <div class="detail-head">
        <button class="back" type="button" onclick="show('list')">‹</button>
        <h2 id="detailBrand">Men’s District</h2>
        <button class="heart" id="heart" type="button" onclick="this.classList.toggle('on')">♡</button>
      </div>
      <div class="gallery"><img class="hero" id="hero" alt=""><div class="thumbs" id="thumbs"></div></div>
      <div class="tabs">
        <button class="tab on" id="tabOverview" type="button" onclick="setTab('overview')">Overview</button>
        <button class="tab" id="tabFit" type="button" onclick="setTab('fit')">Fit & Style</button>
      </div>
      <div class="overview-block on" id="overview">
        <div class="copy"><h1 id="detailTitle"></h1><p class="sub" id="detailSub"></p><p class="desc" id="detailDesc"></p></div>
        <div class="specs" id="specs"></div>
      </div>
      <div class="fit-block" id="fit"></div>
    </div>
    <button class="to-top" type="button" onclick="document.getElementById('detailScroll').scrollTo({top:0,behavior:'smooth'})">↑</button>
  </section>
  <section class="screen admin" id="admin">
    <div class="admin-head"><h2>ADMIN PORTAL</h2><button class="edit-toggle" id="editToggle" type="button" onclick="toggleListEdit()">Edit</button></div>
    <div class="admin-actions">
      <button class="admin-preview" type="button" onclick="show('home')">Preview user app</button>
      <button class="admin-save" id="addSuitBtn" type="button" onclick="addSuit()" style="display:none">+ Add tab</button>
      <button class="admin-out" type="button" onclick="signOut()">Sign Out</button>
    </div>
    <div class="admin-rows" id="adminRows"></div>
  </section>
  <section class="screen admin-edit" id="adminEdit">
    <div class="admin-head">
      <button class="back" type="button" onclick="show('admin')">‹</button>
      <h2 id="editHeading">Edit collection</h2>
      <span class="pill">Edit</span>
    </div>
    <form class="admin-form" onsubmit="event.preventDefault(); saveEdit();">
      <label>List name</label><input id="f_listName">
      <label>List subtitle</label><input id="f_listSub">
      <label>Page brand header</label><input id="f_brand">
      <label>Product title</label><input id="f_title">
      <label>Subtitle</label><input id="f_sub">
      <label>Overview description</label><textarea id="f_desc"></textarea>
      <label>Fit & Style text</label><textarea id="f_fitCopy"></textarea>
      <label>Brand spec</label><input id="f_brandName">
      <label>Category</label><input id="f_category">
      <label>Fit</label><input id="f_fit">
      <label>Available colors</label><input id="f_colors">
      <label>Lapel options</label><input id="f_lapels">
      <label>Sizes</label><input id="f_sizes">
      <label>Preview images</label>
      <div class="upload-grid">
        <label class="upload-box" id="box0"><img id="prev0" alt=""><span>Main photo</span><input type="file" accept="image/*" onchange="uploadPreview(0,this)"></label>
        <label class="upload-box" id="box1"><img id="prev1" alt=""><span>Thumb 2</span><input type="file" accept="image/*" onchange="uploadPreview(1,this)"></label>
        <label class="upload-box" id="box2"><img id="prev2" alt=""><span>Thumb 3</span><input type="file" accept="image/*" onchange="uploadPreview(2,this)"></label>
        <label class="upload-box" id="box3"><img id="prev3" alt=""><span>Thumb 4</span><input type="file" accept="image/*" onchange="uploadPreview(3,this)"></label>
      </div>
      <button class="admin-save" type="submit">Save changes</button>
      <div class="saved-toast" id="savedToast">Saved.</div>
    </form>
  </section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCOnJ1ggxaAhmk3ZrZQlWQN6qF0iGXqIt4",
  authDomain: "mens-district.firebaseapp.com",
  projectId: "mens-district",
  storageBucket: "mens-district.firebasestorage.app",
  messagingSenderId: "796084089789",
  appId: "1:796084089789:web:7c12cf996fbf2186aa18d4",
  measurementId: "G-CTVFG7GVVY"
};
let db=null, bucket=null, cloudOn=false;
try { cloudOn=!!window.firebase; if(cloudOn){ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); try{ bucket=firebase.storage().ref(); }catch(e){ bucket=null; } } } catch(e){ cloudOn=false; }

const CATALOG={};
const LIST=[];
const DEFAULT_IDS=['tuxedos','md','westend','capitano','caravelli','gino','creative','creativo','sean'];
const STORES=['miami','pembroke','sunrise','jacksonville'];
const ADMIN_NAME='antwan';
const SLATE=4;
const PLACEHOLDER="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80"><rect width="64" height="80" rx="8" fill="#1a1a1a"/><path d="M16 22l6-6h20l6 6v36H16V22z" fill="none" stroke="#666" stroke-width="1.6"/><path d="M22 22c1 7 5 11 10 11s9-4 10-11" fill="none" stroke="#666" stroke-width="1.6"/></svg>');
let isAdmin=false, currentStore='', editingId=null, listEditing=false, swipeLock=false, unsubscribeCloud=null, addingTab=false;
let workingImages=['','','',''];
try { localStorage.removeItem('md_catalog'); localStorage.removeItem('md_order'); } catch(e){}

function cloudStatus(msg){ let el=document.getElementById('cloudStatus'); if(!el){ el=document.createElement('div'); el.id='cloudStatus'; el.style.cssText='position:absolute;left:10px;right:10px;bottom:8px;z-index:20;font-size:11px;text-align:center;color:#bbb;'; document.querySelector('.phone').appendChild(el);} el.textContent=msg||''; }
function keepImg(u){ return typeof u==='string' && u.length>8 && u.length<700000 && (u.indexOf('http')===0 || u.indexOf('data:image')===0); }
function firstPhoto(item){
  if(item && keepImg(item.listImage)) return item.listImage;
  const imgs=(item&&item.images)||[];
  return imgs.find(keepImg) || PLACEHOLDER;
}
function cleanItem(item){
  const out={};
  Object.keys(item||{}).forEach(k=>{
    const v=item[k]; if(v===undefined||typeof v==='function') return;
    if(k==='images') out.images=(v||[]).filter(keepImg);
    else if(k==='listImage'){ if(keepImg(v)) out.listImage=v; }
    else out[k]=v;
  });
  if(!out.images) out.images=[];
  return out;
}
function persistLocal(){ try{ const slim={}; Object.keys(CATALOG).forEach(id=>slim[id]=Object.assign({},CATALOG[id])); localStorage.setItem('md_catalog',JSON.stringify(slim)); localStorage.setItem('md_order',JSON.stringify(LIST.map(x=>x[0]))); }catch(e){} }
function applyCloud(items,order){
  if(items&&items.length){
    const seen=[];
    items.forEach(([id,data])=>{
      if(DEFAULT_IDS.indexOf(id)!==-1) return;
      const prev=CATALOG[id]||{}; const incoming=Object.assign({},data||{});
      if((!incoming.images||!incoming.images.length)&&prev.images&&prev.images.length) incoming.images=prev.images;
      if(!incoming.listImage && prev.listImage) incoming.listImage=prev.listImage;
      CATALOG[id]=Object.assign({},prev,incoming); seen.push(id);
    });
    const map={}; seen.forEach(id=>map[id]=[id,CATALOG[id].listName||'New Suit',CATALOG[id].listSub||'']);
    const next=[]; (order||[]).forEach(id=>{ if(map[id]) next.push(map[id]); });
    seen.forEach(id=>{ if(!next.some(x=>x[0]===id)) next.push(map[id]); });
    LIST.length=0; next.forEach(i=>LIST.push(i));
  }
  persistLocal(); renderList(); if(document.getElementById('admin').classList.contains('active')) renderAdmin();
}
async function persist(){
  persistLocal(); if(!cloudOn||!db){ cloudStatus('Saved on this device only'); return false; }
  try{
    const ids=LIST.map(x=>x[0]).filter(id=>CATALOG[id]&&DEFAULT_IDS.indexOf(id)===-1);
    await db.collection('md_meta').doc('app').set({order:ids,slate:SLATE},{merge:true});
    for(const id of ids) await db.collection('md_items').doc(id).set(cleanItem(CATALOG[id]));
    cloudStatus(ids.length?('Saved '+ids.length+' suits to all stores'):'List empty — saved'); return true;
  }catch(error){ cloudStatus('Cloud save failed: '+(error.code||error.message)); return false; }
}
async function wipeCloudSlate(){
  const snap=await db.collection('md_items').get(); for(const doc of snap.docs) await doc.ref.delete();
  await db.collection('md_meta').doc('app').set({order:[],slate:SLATE});
  LIST.length=0; Object.keys(CATALOG).forEach(k=>delete CATALOG[k]); persistLocal(); renderList();
  if(document.getElementById('admin').classList.contains('active')) renderAdmin();
}
function setupRealtimeListener(){
  if(!cloudOn||!db){ cloudStatus('Cloud off'); return; }
  if(unsubscribeCloud) unsubscribeCloud();
  unsubscribeCloud=db.collection('md_items').onSnapshot(async snap=>{
    try{ const meta=await db.collection('md_meta').doc('app').get(); const slate=meta.exists?meta.data().slate:0; if(slate!==SLATE){ cloudStatus('Resetting to a clean slate…'); await wipeCloudSlate(); cloudStatus('Clean slate — Admin can add tabs'); return; } }catch(e){}
    const items=[]; snap.forEach(doc=>{ if(DEFAULT_IDS.indexOf(doc.id)!==-1){ doc.ref.delete().catch(()=>{}); return; } items.push([doc.id,doc.data()]); });
    let order=[]; try{ const meta=await db.collection('md_meta').doc('app').get(); order=meta.exists?(meta.data().order||[]):[]; }catch(e){}
    if(!items.length){ LIST.length=0; cloudStatus('Cloud connected — no suits saved yet'); renderList(); if(document.getElementById('admin').classList.contains('active')) renderAdmin(); return; }
    applyCloud(items,order); cloudStatus('Live — '+items.length+' suits in cloud');
  }, err=>cloudStatus('Cloud blocked: '+(err.code||'rules')));
}
function persistSession(){ try{ localStorage.setItem('md_session',JSON.stringify({isAdmin,store:currentStore})); }catch(e){} }
function restoreSession(){ try{ const ses=JSON.parse(localStorage.getItem('md_session')||'null'); if(!ses||!ses.store) return false; currentStore=ses.store; isAdmin=!!ses.isAdmin; document.getElementById('adminPortalBtn').style.display=isAdmin?'block':'none'; if(isAdmin){ renderAdmin(); show('admin'); } else show('home'); return true; }catch(e){ return false; } }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); toggleMenu(false); }
function toggleMenu(open){ document.getElementById('sideMenu').classList.toggle('open',open); document.getElementById('menuBackdrop').classList.toggle('open',open); }
function signOut(){ isAdmin=false; currentStore=''; localStorage.removeItem('md_session'); document.getElementById('adminPortalBtn').style.display='none'; toggleMenu(false); document.getElementById('storeName').value=''; document.getElementById('loginError').textContent=''; show('login'); }
function loginNow(){
  const name=document.getElementById('storeName').value.trim().toLowerCase(); const err=document.getElementById('loginError'); err.textContent='';
  if(!name){ err.textContent='Enter a store name.'; return; }
  if(name===ADMIN_NAME||name==='admin'){ isAdmin=true; currentStore='Admin'; document.getElementById('adminPortalBtn').style.display='block'; persistSession(); renderAdmin(); show('admin'); return; }
  if(STORES.includes(name)){ isAdmin=false; currentStore=name[0].toUpperCase()+name.slice(1); document.getElementById('adminPortalBtn').style.display='none'; persistSession(); show('home'); return; }
  err.textContent='Store not found.';
}
function renderList(){
  const usable=LIST.filter(([id])=>CATALOG[id]&&DEFAULT_IDS.indexOf(id)===-1);
  const rows=document.getElementById('rows');
  if(!usable.length){ rows.innerHTML='<p style="color:#888;padding:28px 8px;text-align:center">No collections yet.<br>Admin can add tabs from the portal.</p>'; return; }
  rows.innerHTML='';
  usable.forEach(([id])=>{
    const item=CATALOG[id];
    const row=document.createElement('div'); row.className='row'; row.onclick=()=>openDetail(id);
    const img=document.createElement('img'); img.alt=''; img.src=firstPhoto(item);
    const text=document.createElement('div'); const h=document.createElement('h3'); h.textContent=item.listName||''; const p=document.createElement('p'); p.textContent=item.listSub||''; text.appendChild(h); text.appendChild(p);
    const chev=document.createElement('div'); chev.className='chev'; chev.textContent='›';
    row.appendChild(img); row.appendChild(text); row.appendChild(chev); rows.appendChild(row);
  });
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderAdmin(){
  const wrap=document.getElementById('adminRows'); wrap.classList.toggle('editing',listEditing); wrap.innerHTML='';
  LIST.forEach(([id])=>{
    const row=document.createElement('div'); row.className='admin-row'; row.draggable=listEditing; row.dataset.id=id;
    row.onclick=()=>{ if(!listEditing) openEdit(id); };
    row.innerHTML=`<span class="grip">⋮⋮</span><div class="thumb-wrap"></div><div class="meta"><h3>${escapeHtml(CATALOG[id].listName)}</h3><p>${escapeHtml(CATALOG[id].listSub)}</p></div>`;
    const img=document.createElement('img'); img.src=firstPhoto(CATALOG[id]);
    const tw=row.querySelector('.thumb-wrap'); tw.appendChild(img);
    const del=document.createElement('button'); del.className='delx'; del.type='button'; del.textContent='×'; del.onclick=e=>{ e.stopPropagation(); deleteSuit(id); };
    const pen=document.createElement('button'); pen.className='pencil'; pen.type='button'; pen.textContent='✎'; pen.onclick=e=>{ e.stopPropagation(); pickSuitPhoto(id); };
    const file=document.createElement('input'); file.className='hidden-file'; file.id='file_'+id; file.type='file'; file.accept='image/*'; file.onchange=function(){ setSuitPhoto(id,this); };
    tw.appendChild(del); tw.appendChild(pen); tw.appendChild(file);
    wrap.appendChild(row);
  });
  if(listEditing) bindAdminDrag(wrap);
}
async function toggleListEdit(){
  const btn=document.getElementById('editToggle');
  if(listEditing){ btn.textContent='Saving…'; const ok=await persist(); listEditing=false; btn.textContent='Edit'; btn.classList.remove('on'); document.getElementById('addSuitBtn').style.display='none'; renderList(); renderAdmin(); cloudStatus(ok?'Done — list saved for all stores':'Done — saved on this device only'); return; }
  listEditing=true; btn.textContent='Done'; btn.classList.add('on'); document.getElementById('addSuitBtn').style.display='inline-block'; renderAdmin();
}
async function addSuit(){
  if(addingTab) return; addingTab=true; const btn=document.getElementById('addSuitBtn'); if(btn) btn.disabled=true;
  const id='custom_'+Date.now();
  CATALOG[id]={ listName:'New Suit', listSub:'Tap to rename', brand:'Men’s District', title:'New Suit', sub:'Tap to rename', desc:'Add a description for this collection.', brandName:'Men’s District', category:'Suit', fit:'Modern Fit', colors:'Black, Navy', lapels:'Notch, Peak', sizes:'34 – 52 (Short, Regular, Long)', fitCopy:'Add fit notes here.', images:[], listImage:'' };
  if(!LIST.some(x=>x[0]===id)) LIST.push([id,CATALOG[id].listName,CATALOG[id].listSub]);
  renderList(); renderAdmin();
  try{ if(cloudOn&&db){ await db.collection('md_items').doc(id).set(cleanItem(CATALOG[id])); await db.collection('md_meta').doc('app').set({order:LIST.map(x=>x[0]),slate:SLATE},{merge:true}); cloudStatus('Added 1 tab'); } else persistLocal(); }catch(e){ alert('Could not add tab: '+(e.code||e.message)); }
  addingTab=false; if(btn) btn.disabled=false;
}
function pickSuitPhoto(id){ const el=document.getElementById('file_'+id); if(el) el.click(); }
function compressThumb(file){
  return new Promise(resolve=>{
    const img=new Image(); const src=URL.createObjectURL(file);
    img.onload=()=>{ const max=280; const scale=Math.min(1,max/img.width); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(src); resolve(c.toDataURL('image/jpeg',0.62)); };
    img.onerror=()=>{ URL.revokeObjectURL(src); resolve(''); };
    img.src=src;
  });
}
async function uploadFile(path,file){
  if(cloudOn&&bucket){
    try{ const ref=bucket.child(path); await Promise.race([ref.put(file,{contentType:file.type||'image/jpeg'}), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),12000))]); return await ref.getDownloadURL(); }
    catch(e){ cloudStatus('Storage blocked — thumb still saved in database'); return ''; }
  }
  return '';
}
async function setSuitPhoto(id,input){
  const file=input.files&&input.files[0]; if(!file||!CATALOG[id]) return;
  if(!CATALOG[id].images) CATALOG[id].images=[];
  const thumb=await compressThumb(file);
  CATALOG[id].images[0]=thumb; CATALOG[id].listImage=thumb; renderList(); renderAdmin();
  const url=await uploadFile('suits/'+id+'/list-'+Date.now()+'.jpg', file);
  if(url&&url.indexOf('http')===0){ CATALOG[id].images[0]=url; CATALOG[id].listImage=url; }
  if(cloudOn&&db) await db.collection('md_items').doc(id).set(cleanItem(CATALOG[id]));
  persist(); renderList(); renderAdmin(); cloudStatus('Photo saved');
}
function deleteSuit(id){
  if(!confirm('Remove this suit?')) return;
  const i=LIST.findIndex(x=>x[0]===id); if(i>=0) LIST.splice(i,1); delete CATALOG[id]; persistLocal(); renderList(); renderAdmin();
  if(cloudOn&&db){ db.collection('md_items').doc(id).delete().catch(()=>{}); db.collection('md_meta').doc('app').set({order:LIST.map(x=>x[0]),slate:SLATE},{merge:true}).catch(()=>{}); }
}
function bindAdminDrag(wrap){
  let dragEl=null; const yOf=e=>e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY;
  function moveRow(y){ const rows=[...wrap.querySelectorAll('.admin-row')]; for(const row of rows){ if(row===dragEl) continue; const r=row.getBoundingClientRect(); if(y<r.top+r.height/2){ wrap.insertBefore(dragEl,row); return; } } wrap.appendChild(dragEl); }
  function endDrag(){ if(!dragEl) return; dragEl.classList.remove('dragging'); dragEl=null; swipeLock=false; const ids=[...wrap.querySelectorAll('.admin-row')].map(r=>r.dataset.id); const map=Object.fromEntries(LIST.map(x=>[x[0],x])); LIST.length=0; ids.forEach(id=>{ if(map[id]) LIST.push(map[id]); }); persist(); renderList(); }
  wrap.querySelectorAll('.admin-row').forEach(row=>{
    row.addEventListener('dragstart', e=>{ dragEl=row; swipeLock=true; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    row.addEventListener('dragend', endDrag);
    row.addEventListener('dragover', e=>{ e.preventDefault(); if(dragEl) moveRow(e.clientY); });
    row.addEventListener('touchstart', e=>{ if(!listEditing) return; dragEl=row; swipeLock=true; row.classList.add('dragging'); }, {passive:true});
    row.addEventListener('touchmove', e=>{ if(!dragEl) return; e.preventDefault(); moveRow(yOf(e)); }, {passive:false});
    row.addEventListener('touchend', endDrag);
  });
}
function openEdit(id){
  editingId=id; const item=CATALOG[id];
  document.getElementById('editHeading').textContent=item.listName;
  f_listName.value=item.listName; f_listSub.value=item.listSub; f_brand.value=item.brand; f_title.value=item.title; f_sub.value=item.sub; f_desc.value=item.desc; f_fitCopy.value=item.fitCopy; f_brandName.value=item.brandName; f_category.value=item.category; f_fit.value=item.fit; f_colors.value=item.colors; f_lapels.value=item.lapels; f_sizes.value=item.sizes;
  workingImages=[item.images[0]||item.listImage||'',item.images[1]||'',item.images[2]||'',item.images[3]||''];
  paintPreviews(); savedToast.style.display='none'; show('adminEdit');
}
function paintPreviews(){ for(let i=0;i<4;i++){ const box=document.getElementById('box'+i), img=document.getElementById('prev'+i), src=workingImages[i]; if(src){ img.src=src; box.classList.add('has'); } else { img.removeAttribute('src'); box.classList.remove('has'); } } }
async function uploadPreview(i,input){
  const file=input.files&&input.files[0]; if(!file) return;
  const thumb=await compressThumb(file);
  workingImages[i]=thumb; paintPreviews();
  const url=await uploadFile('suits/'+(editingId||'tmp')+'/img'+i+'-'+Date.now()+'.jpg', file);
  workingImages[i]=(url&&url.indexOf('http')===0)?url:thumb; paintPreviews();
  if(editingId&&CATALOG[editingId]){
    if(!CATALOG[editingId].images) CATALOG[editingId].images=['','','',''];
    CATALOG[editingId].images[i]=workingImages[i];
    if(i===0) CATALOG[editingId].listImage=workingImages[i];
    if(cloudOn&&db) await db.collection('md_items').doc(editingId).set(cleanItem(CATALOG[editingId]));
    persist(); renderList(); renderAdmin(); cloudStatus('Photo saved');
  }
}
async function saveEdit(){
  if(!editingId||!CATALOG[editingId]) return;
  const item=CATALOG[editingId];
  item.listName=f_listName.value.trim()||item.listName; item.listSub=f_listSub.value.trim(); item.brand=f_brand.value.trim(); item.title=f_title.value.trim(); item.sub=f_sub.value.trim(); item.desc=f_desc.value.trim(); item.fitCopy=f_fitCopy.value.trim(); item.brandName=f_brandName.value.trim(); item.category=f_category.value.trim(); item.fit=f_fit.value.trim(); item.colors=f_colors.value.trim(); item.lapels=f_lapels.value.trim(); item.sizes=f_sizes.value.trim();
  item.images=workingImages.filter(keepImg);
  if(item.images[0]) item.listImage=item.images[0];
  const row=LIST.find(x=>x[0]===editingId); if(row){ row[1]=item.listName; row[2]=item.listSub; }
  persistLocal(); renderList(); renderAdmin();
  savedToast.style.display='block'; savedToast.textContent='Saving…';
  if(!cloudOn||!db){ savedToast.textContent='Saved on this device only'; return; }
  try{ await db.collection('md_items').doc(editingId).set(cleanItem(item)); await db.collection('md_meta').doc('app').set({order:LIST.map(x=>x[0]),slate:SLATE},{merge:true}); savedToast.textContent='Saved. Other stores will see this.'; }
  catch(e){ savedToast.textContent='Save failed: '+(e.code||e.message); }
}
function openDetail(id){
  const item=CATALOG[id];
  document.getElementById('detailBrand').textContent=item.brand||'';
  document.getElementById('detailTitle').textContent=item.title||'';
  document.getElementById('detailSub').textContent=item.sub||'';
  document.getElementById('detailDesc').textContent=item.desc||'';
  const photos=(item.images||[]).filter(keepImg);
  if(!photos.length && keepImg(item.listImage)) photos.push(item.listImage);
  document.getElementById('hero').src=photos[0]||PLACEHOLDER;
  document.getElementById('thumbs').innerHTML='';
  photos.forEach((src,i)=>{ const im=document.createElement('img'); if(i===0) im.className='active'; im.src=src; im.onclick=function(){ setHero(this); }; document.getElementById('thumbs').appendChild(im); });
  document.getElementById('specs').innerHTML=[['▣','Brand',item.brandName],['⌂','Category',item.category],['∥','Fit',item.fit],['◉','Available Colors',item.colors],['✓','Lapel Options',item.lapels],['↕','Sizes',item.sizes]].map(([ico,k,v])=>`<div class="spec"><span>${ico}</span><span>${k}</span><span>${v||''}</span></div>`).join('');
  document.getElementById('fit').textContent=item.fitCopy||''; setTab('overview'); document.getElementById('detailScroll').scrollTop=0; show('detail');
}
function setHero(el){ document.getElementById('hero').src=el.src; document.querySelectorAll('#thumbs img').forEach(i=>i.classList.remove('active')); el.classList.add('active'); }
function setTab(which){ document.getElementById('tabOverview').classList.toggle('on',which==='overview'); document.getElementById('tabFit').classList.toggle('on',which==='fit'); document.getElementById('overview').classList.toggle('on',which==='overview'); document.getElementById('fit').classList.toggle('on',which==='fit'); }
function goBack(){ const id=(document.querySelector('.screen.active')||{}).id; if(id==='detail') show('list'); else if(id==='list') show('home'); else if(id==='adminEdit') show('admin'); else if(id==='admin') show('home'); }
function bindSwipe(el){ let sx=0,sy=0,track=false; el.addEventListener('touchstart',e=>{ if(swipeLock) return; const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; track=true; },{passive:true}); el.addEventListener('touchend',e=>{ if(!track||swipeLock){ track=false; return; } track=false; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy; if(dx<-45&&Math.abs(dx)>Math.abs(dy)*1.1) goBack(); },{passive:true}); }
['list','detail','admin','adminEdit','home'].forEach(id=>bindSwipe(document.getElementById(id)));
renderList(); restoreSession(); setupRealtimeListener();
</script>
